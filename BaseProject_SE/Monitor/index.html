<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>재와 갈대 · 월드 모니터</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#121820;color:#e8edf1}body{max-width:1200px;margin:32px auto;padding:0 24px}h1{font-size:26px}h2{font-size:19px}small,.muted{color:#9eacb9}#status{padding:14px;border-left:4px solid #dab96c;background:#202a35}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{background:#202a35;border:1px solid #344150;border-radius:10px;padding:18px;min-width:160px;flex:1}.value{font-size:30px;display:block;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #344150}input,select{padding:9px;background:#202a35;color:inherit;border:1px solid #536170;border-radius:5px;margin:6px}.scroll{overflow:auto}#villages{display:flex;gap:12px;flex-wrap:wrap}p{line-height:1.6}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<h1>재와 갈대 <small>월드 모니터</small></h1>
<p id="status">게임 상태를 기다리는 중…</p><div class="cards" id="counts"></div>
<h2>마을별 상태</h2><div id="villages"></div>
<h2>NPC 상태</h2><input id="search" placeholder="이름 또는 ID 검색" aria-label="NPC 검색"><select id="village" aria-label="마을 필터"><option value="">전체 마을</option></select>
<div class="scroll"><table><thead><tr><th>이름 / ID</th><th>마을</th><th>상태</th><th>위치</th><th>기본 대사</th></tr></thead><tbody id="npcs"></tbody></table></div>
<h2>몹 · 야생동물 상태</h2><div class="scroll"><table><thead><tr><th>이름 / ID</th><th>분류</th><th>상태</th><th>체력</th><th>위치</th><th>부활 대기(초)</th></tr></thead><tbody id="creatures"></tbody></table></div>
<p class="muted">현재 로드된 장면만 집계합니다. 인구는 등록된 주민 NPC 수이며 플레이어와 몹을 제외합니다. 미구현 값은 추정하지 않습니다.</p>
<details><summary>수신 JSON</summary><pre id="raw"></pre></details>
<script>
let snapshot;
const el = id => document.getElementById(id);
function node(tag, text, parent, cls) { const n=document.createElement(tag); n.textContent=text; if(cls)n.className=cls; parent.append(n); return n; }
const value = x => x == null ? '미구현' : Array.isArray(x) ? x.join(', ') || '없음' : String(x);
function renderNpcs() {
 const body=el('npcs'); body.replaceChildren(); if(!snapshot)return;
 const query=el('search').value.toLocaleLowerCase(), selected=el('village').value;
 for(const n of snapshot.npcs) {
  if(selected && n.village_id!==selected || !(n.name+' '+n.id).toLocaleLowerCase().includes(query))continue;
  const row=node('tr','',body), village=snapshot.villages.find(v=>v.id===n.village_id);
  for(const text of [n.name+' / '+n.id,village?.name || '소속 없음',({idle:'대기',walking:'이동',talking:'대화'})[n.state] || n.state,`${n.x.toFixed(2)}, ${n.y.toFixed(2)}`,n.dialogue || '없음'])node('td',text,row);
 }
 if(!body.children.length)node('td','표시할 NPC가 없습니다.',node('tr','',body)).colSpan=5;
}
function render(s) {
 snapshot=s;
 const age=Math.max(0,(Date.now()-s.timestamp_ms)/1000);
 el('status').textContent=`${age>5?'갱신 중단 · 마지막 수신 상태':'연결됨'} | ${s.scene_name || s.scene} | ${age.toFixed(1)}초 전 | ${s.focused?'게임 활성':'게임 비활성 · 시뮬레이션 정지 가능'}`;
 el('counts').replaceChildren();
 for(const [label,count] of [['NPC',s.counts.npc],['생존 몹',s.counts.mobs_alive],['전체 몹 (사망 포함)',s.counts.mobs_total],['야생동물',s.counts.wildlife]]) {const c=node('div',label,el('counts'),'card');node('strong',String(count),c,'value');}
 el('villages').replaceChildren();
 const selected=el('village').value;el('village').replaceChildren();node('option','전체 마을',el('village')).value='';
 for(const v of s.villages) {
  const card=node('article','',el('villages'),'card');node('h3',v.name,card);
  node('p',`인구 ${v.population}명 · 분위기: ${value(v.mood)}`,card);
  node('p',`소문: ${value(v.rumors)} · 성향: ${value(v.alignment)}`,card);
  node('option',v.name,el('village')).value=v.id;
 }
 if(!s.villages.length)node('p','현재 장면에 등록된 마을이 없습니다.',el('villages'));
 if(s.villages.some(v=>v.id===selected))el('village').value=selected;
 el('creatures').replaceChildren();
 for (const c of s.creatures || []) {
  const row=node('tr','',el('creatures'));
  for (const text of [c.name+' / '+c.id,c.category==='mob'?'몹':'야생동물',c.state==='dead'?'사망':'생존',c.health ?? '해당 없음',`${c.x.toFixed(2)}, ${c.y.toFixed(2)}`,c.state==='dead' ? c.respawn_seconds?.toFixed(1) ?? '—' : '—']) node('td',String(text),row);
 }
 if (!el('creatures').children.length) node('td','등록된 몹·야생동물이 없습니다.',node('tr','',el('creatures'))).colSpan=6;
 el('raw').textContent=JSON.stringify(s,null,2);renderNpcs();
}
async function poll() {
 try {const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!response.ok)throw Error();const s=await response.json();if(s.schema_version!==1||!Array.isArray(s.npcs)||!Array.isArray(s.villages))throw Error();render(s);}
 catch {el('status').textContent='연결 대기 / 수신 실패 · 게임 실행과 서버의 --data 경로를 확인하세요. 기존 표는 마지막 수신 상태입니다.';}
 finally {setTimeout(poll,1000);}
}
el('search').addEventListener('input',renderNpcs);el('village').addEventListener('change',renderNpcs);poll();
</script></html>
